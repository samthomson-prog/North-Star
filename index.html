<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>North Star Metrics - Live Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 p-7 font-sans min-h-screen">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-4xl font-bold text-pink-500 mb-9 text-center">NORTH STAR METRICS</h1>

    <!-- Centered Dropdown -->
    <div class="mb-8 flex justify-center w-full">
      <select id="month" class="w-64 p-3 bg-gray-800 rounded text-white text-lg font-semibold shadow-lg"></select>
    </div>

    <!-- KPI Cards -->
    <div id="dashboard" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmn96vxxx71rvxX7Q3pnj16KtJeEEOaSLM-mF1kkq1SoWpuBH089S0TnGtRW7imST3QxNDmuXBTnFG/pub?output=csv';

    const metrics = [
      { key: 'Revenue', label: 'Revenue' },
      { key: 'Capital_Raised', label: 'Capital Raised' },
      { key: 'New_WS_Investors', label: 'New WS Investors' },
      { key: 'New_Premium_Raises', label: 'New Premium Raises' },
      { key: 'New_Property_Projects', label: 'New Property Projects' },
      { key: 'New_Managed_Funds', label: 'New Managed Funds' },
    ];

    const monthSelect = document.getElementById('month');
    const dashboard = document.getElementById('dashboard');
    let parsedData = [];

    function fetchData() {
      fetch(sheetUrl)
        .then(res => res.text())
        .then(csv => {
          const rows = csv.trim().split('\n').map(row => row.split(','));
          const headers = rows[0];
          parsedData = rows.slice(1).map(row => {
            const obj = {};
            headers.forEach((header, i) => {
              obj[header.trim()] = row[i] ? row[i].trim() : '';
            });
            return obj;
          });

          populateMonths(parsedData);
          monthSelect.addEventListener('change', () => renderDashboard(monthSelect.value));
          renderDashboard(parsedData[0]?.Month); // auto-select latest
        });
    }

    function populateMonths(data) {
      data.forEach(row => {
        const opt = document.createElement('option');
        opt.value = row.Month;

        const [day, month, year] = row.Month.split('/');
        const date = new Date(year, month - 1, day);
        const formatted = date.toLocaleString('default', { month: 'long', year: 'numeric' });

        opt.textContent = formatted;
        monthSelect.appendChild(opt);
      });
    }

    function renderDashboard(selectedMonth) {
  dashboard.innerHTML = '';
  const row = parsedData.find(r => r.Month === selectedMonth);
  if (!row) return;

  // Get June 2026 targets once here
  const juneTargetRow = parsedData.find(r => r.Month === '30/06/2026');

  metrics.forEach(metric => {
    const actual = parseFloat(row[`${metric.key}_Actual`] || 0);
    const monthlyTarget = parseFloat(row[`${metric.key}_Target`] || 0);
    const variance = actual - monthlyTarget;

    // Use June 2026 target for progress bar
    const juneTarget = juneTargetRow ? parseFloat(juneTargetRow[`${metric.key}_Target`] || 0) : 0;
    const percent = juneTarget ? (actual / juneTarget * 100).toFixed(1) : 0;

    const isMoney = ['Revenue', 'Capital_Raised'].includes(metric.key);
    const useShort = true;

    const card = document.createElement('div');
    card.className = "bg-gray-800 rounded-lg p-5 shadow text-center flex flex-col justify-between h-full";

    card.innerHTML = `
  <div class="flex flex-col items-center justify-center text-center w-full">
    <h2 class="text-3xl font-extrabold text-pink-400 mb-4">${metric.label}</h2>

    <div class="text-xl">Actual: <span class="font-extrabold text-white text-2xl">
      ${formatNumber(actual, isMoney, useShort)}
    </span></div>

    <div class="text-xl">Target: <span class="font-extrabold text-white text-2xl">
      ${formatNumber(monthlyTarget, isMoney, useShort)}
    </span></div>

    <div class="text-xl">Variance: <span class="font-extrabold ${variance < 0 ? 'text-red-400' : 'text-green-400'} text-2xl">
      ${formatNumber(variance, isMoney, true)}
    </span></div>

    <div class="w-full bg-gray-700 h-3 rounded-full mt-4">
      <div class="h-3 rounded-full bg-pink-500" style="width: ${Math.min(percent, 100)}%"></div>
    </div>

    <div class="text-xl mt-4 text-white font-extrabold">${percent}%YTD progress vs full-year target</div>
  </div>
`;

  });
}


    function formatNumber(num, isCurrency = true, useShort = true) {
      if (isNaN(num)) return '-';
      const abs = Math.abs(num);
      const sign = num < 0 ? '-' : '';

      if (isCurrency) {
        if (useShort) {
          if (abs >= 1e6) return `${sign}$${(abs / 1e6).toFixed(2)}M`;
          if (abs >= 1e3) return `${sign}$${Math.round(abs / 1e3)}k`;
          return `${sign}$${Math.round(abs)}`;
        } else {
          return `${sign}$${abs.toLocaleString()}`;
        }
      } else {
        return `${sign}${abs.toLocaleString()}`;
      }
    }

    fetchData();
  </script>
</body>
</html>
